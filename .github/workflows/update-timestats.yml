name: wakapi-stats

on:
  workflow_dispatch:
  schedule:
    # 00:01 北京时间 = 前一天 16:01 UTC
    - cron: '1 16 * * *'

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          COMMIT_BY_ME: "False"
          COMMIT_MESSAGE: "Updated dev metrics"
          COMMIT_USERNAME: "yyhhkya"
          COMMIT_EMAIL: "1163635725@qq.com"
          # Wakapi backend instead of wakatime.com. The action appends
          # "users/current/stats/...", so the base URL has to be the Wakapi API
          # root ending in /api/v1/ (without it, Wakapi answers 404).
          # Override with a repository variable to point at your own instance.
          WAKATIME_API_URL: ${{ vars.WAKATIME_API_URL || 'https://wakapi.dev/api/v1/' }}
          WAKATIME_API_KEY: ${{ secrets.WAKAPI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: "wakapi"
          SHOW_OS: "False"
          SHOW_PROJECTS: "True"
          SHOW_UPDATED_DATE: "True"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_EDITORS: "False"
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_COMMIT: "True"
          SHOW_LOC_CHART: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_SHORT_INFO: "True"
          # Wakapi's stats API has no AI fields (ai_sessions, ai_model_breakdown,
          # token/cost counters), so the weekly AI block can only ever render its
          # "no activity" placeholder. The all-time AI Code Time badge is left
          # enabled: it appears only if Wakapi reports an all-time "AI Coding"
          # category, and is silently skipped otherwise.
          SHOW_AI_CODING: "False"